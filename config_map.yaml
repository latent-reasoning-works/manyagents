# Schema file for mapping high-level requests to ManyLatents configurations
# Maps dataset aliases to their specific config names in ManyLatents
datasets:
  SWISSROLL: swissroll
  HGDP: hgdp_split
  MNIST: mnist
  FASHION_MNIST: fashion_mnist

# Maps algorithm aliases to their config paths and base types in ManyLatents
algorithms:
  PCA:
    path: algorithms/latent=pca
    base: algorithms=latent_base
  UMAP:
    path: algorithms/latent=umap
    base: algorithms=latent_base
  TSNE:
    path: algorithms/latent=tsne
    base: algorithms=latent_base
  PHATE:
    path: algorithms/preprocessing=phate
    base: algorithms=preprocessing_base

# Defines the template for generating the final configuration
template:
  base: "experiment=single_algorithm"