[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manyagents"
version = "0.1.0"
description = "Minimal ManyAgents prototype with ManyLatents integration"
authors = [
    { name = "César Miguel Valdez Córdova", email = "cesar.valdez@mila.quebec" },
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.0",
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "numpy>=1.20",
    "manylatents",
]

[project.optional-dependencies]
dev = ["pytest>=6.0", "ruff>=0.6.0", "pre-commit>=2.0"]
docs = ["mkdocs>=1.6.1", "mkdocs-material>=9.0.0"]

[project.scripts]
manyagents = "manyagents.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["manyagents"]

[tool.uv]
managed = true

[[tool.uv.dependency-metadata]]
name = "heatgeo"
version = "0.0.1"
requires-dist = ["numpy>=1.23.5"]

[tool.uv.sources]
manylatents = { git = "https://github.com/cmvcordova/manyLatents.git", branch = "main" }
