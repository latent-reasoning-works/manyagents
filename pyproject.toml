[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "manyagents"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Multi-agent evaluation and reasoning trace extraction for scientific workflows"
authors = [
    { name = "Latent Reasoning Works" },
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "numpy>=1.20",
    "openai>=1.58.0",  # chat.completions.create(reasoning_effort=...)
    "anthropic>=0.28.0",  # messages.create(tools=...) outside the beta API
    "transformers>=4.51.0",  # Qwen3, the shipped local-model default
    "accelerate>=0.27.0",
    "pandas>=2.3.2",
]

[project.urls]
Homepage = "https://github.com/latent-reasoning-works/manyagents"
Repository = "https://github.com/latent-reasoning-works/manyagents"
Issues = "https://github.com/latent-reasoning-works/manyagents/issues"
Changelog = "https://github.com/latent-reasoning-works/manyagents/blob/main/CHANGELOG.md"

[project.optional-dependencies]
traces = ["manylatents>=0.1.7,<0.2", "datasets>=3.0", "scipy>=1.8,<1.15"]
wandb = ["wandb>=0.25"]
full = ["manyagents[traces,wandb]", "biomni>=0.0.2"]
# vLLM generation backend (GPU). Imported lazily by VLLMAdapter / inference.py,
# so the core install never requires it and CPU CI skips the vLLM tests.
vllm = ["vllm>=0.8.5"]  # Qwen3 support
dev = ["pytest>=6.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0", "pre-commit>=2.0"]

[project.scripts]
manyagents = "manyagents.main:main"
manyagents-generate-registry = "manyagents.adapters._generate_metric_registry:main"

[tool.hatch.build.targets.wheel]
# Hydra composes configs from the installed package; keep all package data.
only-include = ["manyagents"]
exclude = ["manyagents/**/test_*.py"]

[tool.hatch.build.targets.sdist]
only-include = [
    "manyagents",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests", "manyagents"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "requires_manylatents: requires the optional manylatents dependency (traces extra)",
]

[dependency-groups]
# Synced by default on `uv run`/`uv sync` — this is what the pre-push
# checklist (`uv run pytest` / `uv run ruff`) relies on. Keep ruff here so
# `uv run ruff check` works without the `[dev]` extra.
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6.0",
]

[tool.ruff.lint]
# Keep the existing correctness checks explicit across Ruff releases.
select = ["E4", "E7", "E9", "F"]
