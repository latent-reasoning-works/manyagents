[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manyagents"
version = "0.1.0"
description = "Multi-agent evaluation and reasoning trace extraction"
authors = [
    { name = "César Miguel Valdez Córdova" },
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pydantic>=2.0",
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "numpy>=1.20",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "pandas>=2.3.2",
]

[project.optional-dependencies]
traces = ["manylatents>=0.1.6,<0.2", "datasets>=3.0", "scipy>=1.8,<1.15"]
wandb = ["wandb>=0.25"]
full = ["manyagents[traces,wandb]", "biomni>=0.0.2"]
# vLLM generation backend (GPU). Imported lazily by VLLMAdapter / inference.py,
# so the core install never requires it and CPU CI skips the vLLM tests.
vllm = ["vllm>=0.6.0"]
dev = ["pytest>=6.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0", "pre-commit>=2.0"]

[project.scripts]
manyagents = "manyagents.main:main"
manyagents-generate-registry = "manyagents.adapters._generate_metric_registry:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["manyagents"]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests", "manyagents"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "requires_manylatents: requires the optional manylatents dependency (traces extra)",
]

[dependency-groups]
# Synced by default on `uv run`/`uv sync` — this is what the pre-push
# checklist (`uv run pytest` / `uv run ruff`) relies on. Keep ruff here so
# `uv run ruff check` works without the `[dev]` extra.
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6.0",
]
