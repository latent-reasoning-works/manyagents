[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manyagents"
version = "0.1.0"
description = "Minimal ManyAgents prototype with ManyLatents integration"
authors = [
    { name = "César Miguel Valdez Córdova", email = "cesar.valdez@mila.quebec" },
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pydantic>=2.0",
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "numpy>=1.20",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "pandas>=2.3.2",
]

[project.optional-dependencies]
# TODO: Move manylatents to main deps when repo is public
full = ["manylatents", "biomni>=0.0.2"]
# vLLM generation backend (GPU). Imported lazily by VLLMAdapter / inference.py,
# so the core install never requires it and CPU CI skips the vLLM tests.
vllm = ["vllm>=0.6.0"]
dev = ["pytest>=6.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0", "pre-commit>=2.0"]
docs = ["mkdocs>=1.6.1", "mkdocs-material>=9.0.0"]

[project.scripts]
manyagents = "manyagents.main:main"
manyagents-generate-registry = "manyagents.adapters._generate_metric_registry:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["manyagents"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
managed = true

[[tool.uv.dependency-metadata]]
name = "heatgeo"
version = "0.0.1"
requires-dist = ["numpy>=1.25"]

[tool.uv.sources]
manylatents = { git = "https://github.com/latent-reasoning-works/manylatents", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests", "manyagents"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
]
