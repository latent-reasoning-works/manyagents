# @package _global_
# HuggingFace model agent configuration

agent:
  name: hf
  adapter: hf
  config:
    # Cluster aliases are optional; Hub IDs and paths work on any host.
    available_models: ${oc.select:available_models}
    model: Qwen/Qwen3-0.6B
    temperature: 0.1
    max_new_tokens: 2000
