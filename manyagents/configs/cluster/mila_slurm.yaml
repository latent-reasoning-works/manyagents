# @package _global_

# Direct SLURM submission on Mila cluster via submitit
# Usage: python -m manyagents.main cluster=mila_slurm resources=local_llm experiment=...

defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  mode: MULTIRUN
  run:
    dir: outputs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/${name}/multiruns/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

  launcher:
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

    # Base SLURM parameters
    cpus_per_task: 4
    gpus_per_task: 1
    mem_gb: 48
    timeout_min: 240  # 4 hours

    # Partition and account
    partition: main
    # account: null  # Auto-detect

    # Submitit settings
    tasks_per_node: 1
    nodes: 1

    # Additional SLURM settings
    additional_parameters:
      gres: gpu:1

    # Setup commands
    setup:
      - echo "Job starting on $(hostname)"
      - export HF_HOME=/network/weights/.cache/huggingface
      - export TRANSFORMERS_CACHE=/network/weights/.cache/huggingface

# WandB configuration
wandb:
  group: reasoning_baseline_${now:%Y%m%d}

# Site-local weights and model aliases shared by HF and vLLM agents.
available_models:
  llama-3.3-70b: /network/weights/llama.var/llama_3.3/Llama-3.3-70B-Instruct
  llama-3.1-70b: /network/weights/llama.var/llama_3.1/Meta-Llama-3.1-70B-Instruct
  llama-3.1-8b: /network/weights/llama.var/llama_3.1/Meta-Llama-3.1-8B-Instruct
  llama-3.1-405b-fp8: /network/weights/llama.var/llama_3.1/Meta-Llama-3.1-405B-Instruct-FP8
  olmo-7b: /network/weights/olmo/OLMo-7B-Twin-2T
  olmo-1b: /network/weights/olmo/OLMo-1B-Twin-2T
  olmoe-1b-7b: /network/weights/olmoe/OLMoE-1B-7B-0924
  qwen3-0.6b: Qwen/Qwen3-0.6B
  qwen3-4b: Qwen/Qwen3-4B
  qwen3-8b: Qwen/Qwen3-8B
