# Main configuration for ManyAgents execution skeleton
name: manyagents_skeleton

# Execution settings
execution:
  mode: subprocess  # or 'import' when available
  timeout_s: 300
  dry_run: false

# Output settings
output:
  dir: outputs
  log_commands: true

# Hydra run configuration
hydra:
  run:
    dir: outputs/${name}_${now:%Y-%m-%d_%H-%M-%S}