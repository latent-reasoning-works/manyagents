# @package _global_
# Main configuration for ManyAgents orchestrator

defaults:
  - _self_
  - optional experiment: null

name: manyagents_default

# Default workflow (empty - provide via experiment config or CLI overrides)
workflow:
  steps: []

# Output directory
output_dir: outputs/${name}_${now:%Y-%m-%d_%H-%M-%S}

# wandb experiment logging (disabled by default)
# Enable with: wandb.enabled=true
wandb:
  enabled: false
  project: manyagents
  entity: null  # Set to your wandb team/user
  tags: []  # Add tags via CLI: wandb.tags=[invariance,llm-comparison]

# Hydra configuration
hydra:
  run:
    dir: ${output_dir}
