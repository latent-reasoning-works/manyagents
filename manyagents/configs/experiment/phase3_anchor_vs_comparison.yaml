# @package _global_
# Phase 3 Integration Test: Anchor vs Comparison
#
# Demonstrates the core Phase 3 workflow:
# 1. Anchor: manylatents PCA (computes metrics natively) OR load existing embeddings
# 2. Comparison: manylatents UMAP (computes metrics natively) OR load existing embeddings
# 3. Compare metric vectors to compute reward signal
#
# This validates:
# - Anchor and comparison workflows execute correctly
# - Metrics are computed using test_metric (fast)
# - Reward calculation from metric differences
# - Full Phase 3 evaluation pipeline
# - Can compare against existing embeddings from file
#
# Usage:
#   # Generate new embeddings:
#   python -m manyagents.main experiment=phase3_anchor_vs_comparison
#
#   # Compare against existing anchor:
#   python -m manyagents.main experiment=phase3_anchor_vs_comparison \
#     anchor.load_from=outputs/anchor_embeddings.npy
#
# Expected Output:
#   - Two workflow steps with embeddings and metrics
#   - Reward signal showing improvement/degradation
#   - Minimal logging (no wandb)

name: phase3_anchor_vs_comparison

defaults:
  - /logger: minimal  # Use minimal logging for fast tests

# Anchor configuration (fixed point for comparison)
anchor:
  # If load_from is set, load embeddings from file instead of running workflow
  load_from: null  # Path to .npy file with pre-computed embeddings

  # Workflow config (used if load_from is null)
  workflow:
    name: anchor_pca
    agent: manylatents
    config:
      experiment: single_algorithm
      algorithms:
        latent:
          _target_: manylatents.algorithms.latent.pca.PCAModule
          n_components: 2
      metrics: test_metric  # Fast metric for integration testing
      callbacks:
        embedding: minimal  # No wandb logging
      project: manyagents_phase3_tests
      debug: false

# Comparison configuration (method being evaluated)
comparison:
  # If load_from is set, load embeddings from file instead of running workflow
  load_from: null  # Path to .npy file with pre-computed embeddings

  # Workflow config (used if load_from is null)
  workflow:
    name: comparison_umap
    agent: manylatents
    config:
      experiment: single_algorithm
      algorithms:
        latent:
          _target_: manylatents.algorithms.latent.umap.UMAPModule
          n_components: 2
          n_neighbors: 15
          min_dist: 0.1
      metrics: test_metric  # Fast metric for integration testing
      callbacks:
        embedding: minimal  # No wandb logging
      project: manyagents_phase3_tests
      debug: false

# Workflow steps
workflow:
  steps:
    - name: anchor_pca
      agent: manylatents
      config:
        experiment: single_algorithm
        algorithms:
          latent:
            _target_: manylatents.algorithms.latent.pca.PCAModule
            n_components: 2
        metrics: test_metric
        callbacks:
          embedding: minimal
        project: manyagents_phase3_tests
        debug: false

    - name: comparison_umap
      agent: manylatents
      config:
        experiment: single_algorithm
        algorithms:
          latent:
            _target_: manylatents.algorithms.latent.umap.UMAPModule
            n_components: 2
            n_neighbors: 15
            min_dist: 0.1
        metrics: test_metric
        callbacks:
          embedding: minimal
        project: manyagents_phase3_tests
        debug: false

# Phase 3 evaluation config
evaluation:
  # Metrics already computed by manylatents in each step
  # We'll extract and compare them programmatically
  reward_function:
    type: weighted
    weights:
      Trustworthiness: 0.7
      Continuity: 0.3

output_dir: outputs/phase3_tests/anchor_vs_comparison
