name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-manylatents-integration:
    name: Test ManyLatents Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install UV package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          uv sync

      - name: Test manylatents integration with metrics
        timeout-minutes: 8
        run: |
          source .venv/bin/activate
          # Run the fast pipeline with test_metric (tests all 3 metric groups)
          # This validates:
          # - manyAgents → manylatents adapter works
          # - Multi-step pipeline execution
          # - Metrics computation (dataset/embedding/module)
          # - Config overrides work correctly
          # - In-memory data passing between steps
          # Debug mode disables wandb (faster CI)
          python -m manyagents.main \
            experiment=manylatents_pipeline_with_metrics \
            workflow.steps.0.config.debug=true \
            workflow.steps.1.config.debug=true

      - name: Upload workflow outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-workflow-outputs
          path: |
            outputs/
            wandb/
          retention-days: 7
