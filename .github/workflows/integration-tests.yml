name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          # Create venv and install core deps only (skip private git repos)
          # TODO: Use `uv sync` when manylatents/biomni repos are public
          uv venv
          uv pip install pydantic hydra-core hydra-submitit-launcher numpy \
            openai anthropic transformers accelerate \
            pytest pytest-asyncio
          # Install manyagents in editable mode (without resolving optional deps)
          uv pip install -e . --no-deps

      - name: Run smoke tests
        run: .venv/bin/pytest tests/test_smoke.py -v

      - name: Run mock experiment
        run: .venv/bin/python -m manyagents.main experiment=test_wandb
